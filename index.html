<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>약관 및 정책 · 곁</title>
<style>
  :root { --bg:#F3F5F2; --card:#FFFFFF; --ink:#1F2B29; --muted:#6A7673; --line:#E1E6E2; --accent:#2E6A5C; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111715; --card:#19211F; --ink:#E6ECE9; --muted:#93A09C; --line:#2A3431; --accent:#86C6B4; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  .brand { font-family: "Gowun Batang", serif; font-weight:700; font-size:28px; color:var(--accent); text-decoration:none; }
  h1 { font-size:22px; margin:18px 0 2px; }
  .date { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px 20px 20px; }
  h2 { font-size:16px; margin:22px 0 6px; }
  p { margin:0; white-space:pre-line; }
  .intro { margin-top:16px; }
  a { color:var(--accent); }
  ul { list-style:none; padding:0; margin:0; }
  li a { display:block; padding:16px 4px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--ink); font-size:16px; }
  li:last-child a { border-bottom:0; }
  footer { color:var(--muted); font-size:13px; margin-top:24px; text-align:center; }
</style>
</head>
<body>
<main>
<a class="brand" href="./">곁</a>
<h1>약관 및 정책</h1>
<p class="date">시행일 2026년 10월 6일</p>
<div class="card"><ul>
<li><a href="terms">서비스 이용약관</a></li>
<li><a href="privacy">개인정보처리방침</a></li>
</ul></div>
<footer>곁 · 우리 삶의 반려견, 반려묘<br>펫니티 · 대표 김태우 · 사업자등록번호 271-11-03401 · kgyeot@gmail.com</footer>
</main>
</body>
</html>
